<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>© FINBONK testavimo aplinka · Prisijungimas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ancizar+Sans:ital,wght@0,100..1000;1,100..1000&display=swap" rel="stylesheet">
    <meta property="og:image" content="https://raw.githubusercontent.com/createdbymatas/finbonk/refs/heads/main/thumbnail.jpg">
    <meta property="og:image:type" content="image/jpg">
    <meta property="og:image:width" content="500">
    <meta property="og:image:height" content="500">
    <meta property="og:title" content="© FINBONK">
    <meta property="og:description" content="Created by Matas">
    <link rel="apple-touch-icon" href="thumbnail.jpg">
    <link rel="shortcut icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body onload="loaded()">
    <div id="loading">
        <div id="loader"></div>
        <p id="ikeliama">Įkeliama</p>
    </div>

    <nav>
        <h1>© FINBONK testavimo aplinka</h1>
        <h1 id="user"><i class="fa-regular fa-circle-user"></i> Neprisijungta</h1>
    </nav>

    <div id="loginWindow">
        <h1>© FINBONK testavimo aplinka</h1>
        <h2>Prisijungimas prie patikrinimo</h2>
        <p style="font-size: 20px;"><i class="fa-regular fa-address-card"></i> Naudotojo vardas</p>
        <input id="username" type="text" autocomplete="off" placeholder="Rašyk čia">
        <p style="font-size: 20px; margin-top: 20px;"><i class="fa-solid fa-key"></i> Slaptažodis</p>
        <input id="password" type="text" autocomplete="off" placeholder="Rašyk čia">
        <i class="fa-regular fa-eye" id="eye" onclick="showPass()"></i>
        <button id="loginBtn" ontouchstart onclick="login()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Prisijungti</button>
        <div id="loader3"></div>
        <p id="status">status</p>
        <input type="text" value="1" id="inp" style="display: none;">
    </div>

    <p id="copyright">&copy; 2025-26 · Pupulio testavimo sistema · Visos teisės saugomos</p>

    <script src="https://kit.fontawesome.com/a11707644f.js" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <script>
        document.body.onkeydown = function(e){
            if (e.keyCode === 13 && e.target === document.getElementById("username") || e.keyCode === 13 && e.target === document.getElementById("password")) {
                e.preventDefault();
                login();
            }
        }
        function showPass(){
            if(document.getElementById("inp").value == "1"){
                document.getElementById("password").style.webkitTextSecurity = "none";
                document.getElementById("password").style.moxTextSecurity = "none";
                document.getElementById("eye").classList.add("fa-eye-slash");
                document.getElementById("eye").classList.remove("fa-eye");
                document.getElementById("inp").value = "0";
            }
            else{
                document.getElementById("password").style.webkitTextSecurity = "disc";
                document.getElementById("password").style.moxTextSecurity = "disc";
                document.getElementById("eye").classList.remove("fa-eye-slash");
                document.getElementById("eye").classList.add("fa-eye");
                document.getElementById("inp").value = "1";
            }
        }
    </script>
</body>
</html>
